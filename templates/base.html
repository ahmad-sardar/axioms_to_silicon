<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="canonical" href="{% block canonical %}{{ current_url | safe }}{% endblock canonical %}">
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
  <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
  <meta property="og:url" content="{% block og_url %}{{ current_url | safe }}{% endblock og_url %}">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=inter:400,600,800|source-serif-4:400,400i,600,700" rel="stylesheet" />
  <link rel="stylesheet" href="{{ get_url(path='css/site.css') | safe }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
</head>
<body class="theme-retro">
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <nav class="site-nav" aria-label="Main">
        <a href="{{ get_url(path='/') | safe }}" class="site-title"{% if current_path == "/" %} aria-current="page"{% endif %}>{{ config.title }}</a>
      </nav>
    </div>
  </header>
  <main id="main" class="site-main">
    {% block content %}{% endblock content %}
  </main>
  <footer class="site-footer">
    <p>
      <a href="{{ config.extra.github }}">GitHub</a>
      ·
      <a href="{{ config.extra.linkedin }}">LinkedIn</a>
      ·
      <a href="{{ config.extra.email }}">Email</a>
      ·
      <a href="{{ get_url(path='sitemap.xml') | safe }}">Sitemap</a>
    </p>
    <p class="copyright">&copy; {{ now() | date(format="%Y") }} {{ config.extra.site_author }}</p>
  </footer>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\begin{align*}", right: "\\end{align*}", display: true },
            { left: "\\begin{align}", right: "\\end{align}", display: true },
            { left: "\\begin{equation}", right: "\\end{equation}", display: true }
          ],
          throwOnError: false
        });
      }

      // Active TOC highlighting scroll spy
      var tocLinks = document.querySelectorAll(".page-toc a");
      if (tocLinks.length > 0) {
        var headings = [];
        var linkMap = new Map();

        tocLinks.forEach(function (link) {
          try {
            var hash = link.hash;
            if (hash) {
              var id = decodeURIComponent(hash.slice(1));
              var heading = document.getElementById(id);
              if (heading) {
                headings.push(heading);
                linkMap.set(heading, link);
              }
            }
          } catch (e) {}
        });

        if (headings.length > 0) {
          var threshold = 120; // px offset from top of viewport

          function updateActiveToc() {
            var currentActive = null;
            for (var i = 0; i < headings.length; i++) {
              var heading = headings[i];
              var rect = heading.getBoundingClientRect();
              if (rect.top <= threshold) {
                currentActive = heading;
              } else {
                break;
              }
            }

            if (!currentActive && window.scrollY < 100) {
              currentActive = headings[0];
            }

            if (currentActive) {
              var activeLink = linkMap.get(currentActive);
              tocLinks.forEach(function (link) {
                if (link === activeLink) {
                  link.classList.add("active");
                } else {
                  link.classList.remove("active");
                }
              });
            }
          }

          window.addEventListener("scroll", updateActiveToc, { passive: true });
          window.addEventListener("resize", updateActiveToc);
          updateActiveToc();
        }
      }
    });
  </script>
  <script data-goatcounter="https://ahmadsardar.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
